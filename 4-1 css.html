<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0222孟梦</title>
    <style>
    h2,h3,p{
        padding:0;
        margin:0;       
    }/*群组选择器*/
    #box{
        padding:8px;
        margin:20px;
        border:1px solid #ccc;
        font-size:12px;
        width:480px;
    }
    #box  h3{
        /*字体大小16px*/
        font-size:16px;
        /*行高33px*/
        line-height:33px;
        /*居中*/
        text-align:center;
        /*颜色#034*/
        color:#034;
        /*字间距*/
        letter-spacing:3px;
        }
        #box>p{
            /*字体大小12px*/
            font-size:12px;
            /*行高20px*/
            line-height:20px;
            /*颜色#666*/
            color:#666;
            /*字间距*/
            letter-spacing:2px;
            }
    .label{
        color:blue;
        font-weight:bold;
    }
    h2{
        background:black;
        color:white;
        text-align:center;
        line-height:150%;
    }
    .knowledge{
        background:blue;
        color:white;
    }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p><span class="label">学号</span>：222，<span class="label">姓名</span>：<span class="bb">孟</span>梦，<span class="label">班级</span>：24011，《高级网页设计》的学习难度：困难，
            本实例的知识点：<span class="knowledge">CSS群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
<!--扩展:
1.学号姓名班级的字为蓝色加粗，使用一个css选择器。
2.h2黑底白字行高150%
3.知识点的值为蓝底白字。
-->
</body>
</html>
