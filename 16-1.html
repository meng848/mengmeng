<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：孟梦，日期：2026-10-29，功能名称：JavaScript 数组方法形象化演示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-1 · JS 数组方法大全</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            min-height: 100vh;
            padding: 30px 20px 60px;
            color: #1f2937;
        }
        .mm_container { max-width: 1100px; margin: 0 auto; }
        .mm_back { color: #fff; opacity: .9; text-decoration: none; font-size: .9rem; }
        .mm_back:hover { opacity: 1; text-decoration: underline; }

        header.mm_header { text-align: center; color: #fff; padding: 10px 0 26px; }
        header.mm_header h1 { font-size: 2.1rem; margin-bottom: 8px; letter-spacing: 2px; }
        header.mm_header p { opacity: .9; font-size: .92rem; }

        /* ============ 原始数组展示 ============ */
        .mm_original {
            background: #fff;
            border-radius: 14px;
            padding: 22px 26px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            text-align: center;
        }
        .mm_original h3 {
            font-size: .95rem; color: #0891b2; margin-bottom: 14px;
        }
        .mm_array-box {
            display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            padding: 14px; background: #f0fdfa; border-radius: 10px;
            border: 2px dashed #06b6d4;
        }
        .mm_item {
            width: 54px; height: 54px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 3px 10px rgba(0,0,0,.1);
            transition: all .3s cubic-bezier(.4,1.4,.6,1);
            position: relative;
            font-family: Consolas, Monaco, monospace;
        }
        .mm_item.orig { background: linear-gradient(135deg, #fef3c7, #fde68a); }
        .mm_item.added { background: linear-gradient(135deg, #bbf7d0, #86efac); animation: mm_pop .4s ease; }
        .mm_item.removed { background: linear-gradient(135deg, #fecaca, #fca5a5); transform: scale(.6) rotate(-15deg); opacity: .3; }
        .mm_item.changed { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); animation: mm_shake .4s ease; }
        @keyframes mm_pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes mm_shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* ============ 方法卡片 ============ */
        .mm_cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        .mm_method {
            background: #fff;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 6px 22px rgba(0,0,0,.1);
            border-top: 4px solid var(--mm-accent, #06b6d4);
            transition: transform .2s;
        }
        .mm_method:hover { transform: translateY(-3px); }
        .mm_mtitle {
            font-size: 1.05rem; font-weight: bold; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .mm_mtitle code {
            background: var(--mm-accent, #06b6d4);
            color: #fff; padding: 2px 10px; border-radius: 6px;
            font-size: .85rem; font-family: Consolas, Monaco, monospace;
        }
        .mm_mdesc { color: #6b7280; font-size: .82rem; margin-bottom: 10px; line-height: 1.7; }
        .mm_mdesc.mmm_warn::before { content: "⚠ "; color: #f59e0b; }
        .mm_mdesc.mmm_info::before { content: "ℹ "; color: #3b82f6; }

        .mm_code {
            background: #1f2937; color: #d1d5db;
            padding: 12px 14px; border-radius: 8px;
            font-family: Consolas, Monaco, monospace;
            font-size: .75rem; line-height: 1.65;
            white-space: pre-wrap; margin-bottom: 12px;
            max-height: 80px; overflow-y: auto;
        }
        .mm_code .k { color: #c084fc; }
        .mm_code .s { color: #fbbf24; }
        .mm_code .c { color: #6b7280; }
        .mm_code .f { color: #22d3ee; }

        .mm_actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .mm_btn {
            padding: 7px 16px; border: none; border-radius: 7px;
            cursor: pointer; font-size: .8rem; font-family: inherit;
            background: var(--mm-accent, #06b6d4); color: #fff;
            transition: transform .15s, box-shadow .15s;
        }
        .mm_btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(6,182,212,.4); }
        .mm_btn.mmm_reset { background: #9ca3af; }

        .mm_result {
            background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 8px; padding: 10px 12px;
            font-family: Consolas, Monaco, monospace;
            font-size: .78rem; min-height: 34px;
            color: #374151; white-space: pre-wrap;
        }
        .mm_result strong { color: var(--mm-accent, #06b6d4); }

        /* 类别颜色 */
        .mm_method[data-cat="mutate"]  { --mm-accent: #ef4444; }   /* 改变原数组 */
        .mm_method[data-cat="traverse"]{ --mm-accent: #06b6d4; }   /* 遍历/查找 */
        .mm_method[data-cat="new"]     { --mm-accent: #22c55e; }   /* 返回新数组 */
        .mm_method[data-cat="check"]   { --mm-accent: #a855f7; }   /* 返回布尔/索引 */

        .mm_cat-label {
            display: inline-block; font-size: .68rem;
            padding: 2px 8px; border-radius: 4px; color: #fff; margin-left: 6px;
        }
        .mm_method[data-cat="mutate"]   .mm_cat-label { background: #ef4444; }
        .mm_method[data-cat="traverse"] .mm_cat-label { background: #06b6d4; }
        .mm_method[data-cat="new"]      .mm_cat-label { background: #22c55e; }
        .mm_method[data-cat="check"]    .mm_cat-label { background: #a855f7; }

        @media (max-width: 640px) {
            header.mm_header h1 { font-size: 1.5rem; }
            .mm_method { padding: 14px; }
            .mm_item { width: 44px; height: 44px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="mm_container">
        <a href="index.html" class="mm_back">← 返回首页</a>

        <header class="mm_header">
            <h1>JavaScript 数组方法大全</h1>
            <p>16-1 · 点击卡片上的按钮看效果 🍎🍌🍊🍇🍓</p>
        </header>

        <!-- ============ 原始数组可视化 ============ -->
        <div class="mm_original">
            <h3>📦 当前数组 fruits</h3>
            <div class="mm_array-box" id="mm_origBox">
                <!-- 动态生成 -->
            </div>
            <div style="margin-top:10px; font-size:.8rem; color:#6b7280;">
                长度：<strong id="mm_origLen" style="color:#0891b2;"></strong> ｜
                点下方方法按钮会修改 / 读取这个数组
            </div>
        </div>

        <!-- ============ 方法卡片网格 ============ -->
        <div class="mm_cards" id="mm_cards">
            <!-- 由 JS 动态生成 -->
        </div>

    </div>

    <script>
        // ===== 数据源 =====
        let mm_fruits = ["🍎", "🍌", "🍊", "🍇", "🍓"];

        // ===== 渲染原始数组展示 =====
        function mm_renderOrig(cls) {
            // cls 是个对象，比如 { 1: "added" } 表示 index=1 是新增
            cls = cls || {};
            let mm_box = document.getElementById("mm_origBox");
            mm_box.innerHTML = "";
            mm_fruits.forEach((v, i) => {
                let mm_div = document.createElement("div");
                mm_div.className = "mm_item orig " + (cls[i] || "");
                mm_div.textContent = v;
                mm_div.title = "fruits[" + i + "] = " + v;
                mm_box.appendChild(mm_div);
            });
            document.getElementById("mm_origLen").textContent = mm_fruits.length;
        }
        mm_renderOrig();

        // ===== 方法定义 =====
        // cat: mutate(改原数组红) / new(新数组绿) / traverse(遍历青) / check(检查紫)
        const mm_methods = [
            // ---------- 改变原数组 ----------
            {
                name: "push()", cat: "mutate", title: "末尾添加元素",
                desc: "在数组末尾添加一个或多个元素，返回新长度。",
                descTag: "mm_warn",
                code: 'fruits.push("🍉");\n// 返回值 = 新长度',
                run: function() {
                    let r = mm_fruits.push("🍉");
                    mm_renderOrig({ [mm_fruits.length-1]: "added" });
                    return { h: "push('🍉') 返回：<strong>" + r + "</strong>", note: "数组末尾多了一个 🍉" };
                }
            },
            {
                name: "pop()", cat: "mutate", title: "末尾删除",
                desc: "删除最后一个元素，返回被删除的值。空数组返回 undefined。",
                descTag: "mm_warn",
                code: 'let last = fruits.pop();\n// last = 被删除的元素',
                run: function() {
                    let r = mm_fruits.pop();
                    mm_renderOrig();
                    return { h: "pop() 返回：<strong>" + (r||"undefined") + "</strong>", note: "最后一个元素被移除" };
                }
            },
            {
                name: "shift()", cat: "mutate", title: "开头删除",
                desc: "删除第一个元素，返回被删的值，数组长度 -1。",
                descTag: "mm_warn",
                code: 'let first = fruits.shift();',
                run: function() {
                    let r = mm_fruits.shift();
                    mm_renderOrig();
                    return { h: "shift() 返回：<strong>" + (r||"undefined") + "</strong>", note: "第一个元素被移除" };
                }
            },
            {
                name: "unshift()", cat: "mutate", title: "开头添加",
                desc: "在数组开头插入一个或多个元素，返回新长度。",
                descTag: "mm_warn",
                code: 'fruits.unshift("🥝");',
                run: function() {
                    let r = mm_fruits.unshift("🥝");
                    mm_renderOrig({ 0: "added" });
                    return { h: "unshift('🥝') 返回：<strong>" + r + "</strong>", note: "开头多了一个 🥝" };
                }
            },
            {
                name: "splice()", cat: "mutate", title: "万能增删改",
                desc: "从索引 start 开始，删除 deleteCount 个，并插入新元素。返回被删数组。",
                descTag: "mm_warn",
                code: 'fruits.splice(2, 1, "🥭");\n// 从 index=2 删 1 个，插入 🥭',
                run: function() {
                    let r = mm_fruits.splice(2, 1, "🥭");
                    mm_renderOrig({ 2: "changed" });
                    return { h: "splice(2,1,'🥭') 被删：<strong>" + JSON.stringify(r) + "</strong>", note: "index=2 的元素被换成了 🥭" };
                }
            },
            {
                name: "sort()", cat: "mutate", title: "原地排序",
                desc: "将元素转为字符串按 Unicode 码点排序，会**改变原数组**！数字排序要写比较函数。",
                descTag: "mm_warn",
                code: 'fruits.sort();',
                run: function() {
                    let r = mm_fruits.sort();
                    mm_renderOrig();
                    return { h: "sort() 返回：<strong>" + r.join(" ") + "</strong>", note: "排序后数组已改变" };
                }
            },

            // ---------- 返回新数组 ----------
            {
                name: "map()", cat: "new", title: "映射变换",
                desc: "对每个元素执行回调，把结果组成**新数组**返回，不改变原数组。",
                descTag: "mm_info",
                code: 'let big = fruits.map(f => f + "✨");',
                run: function() {
                    let r = mm_fruits.map(f => f + "✨");
                    return { h: "map(f => f+'✨')：<strong>" + r.join(" ") + "</strong>", note: "原数组没变" };
                }
            },
            {
                name: "filter()", cat: "new", title: "过滤筛选",
                desc: "回调返回 true 的元素留下，组成新数组返回。",
                descTag: "mm_info",
                code: 'let filtered = fruits.filter(f => f !== "🍎");',
                run: function() {
                    let r = mm_fruits.filter(f => f !== "🍎");
                    return { h: "filter(f => f!=='🍎')：<strong>" + r.join(" ") + "</strong>", note: "去掉了所有 🍎" };
                }
            },
            {
                name: "slice()", cat: "new", title: "截取片段",
                desc: "复制 [start, end) 区间的元素组成新数组，不改变原数组。end 可负。",
                descTag: "mm_info",
                code: 'let part = fruits.slice(1, 3);',
                run: function() {
                    let r = mm_fruits.slice(1, 3);
                    return { h: "slice(1, 3)：<strong>" + r.join(" ") + "</strong>", note: "index=1,2 的元素" };
                }
            },
            {
                name: "concat()", cat: "new", title: "拼接合并",
                desc: "合并两个或多个数组 / 值，返回新数组，原数组不变。",
                descTag: "mm_info",
                code: 'let all = fruits.concat(["🥥", "🍋"]);',
                run: function() {
                    let r = mm_fruits.concat(["🥥", "🍋"]);
                    return { h: "concat(['🥥','🍋'])：<strong>" + r.join(" ") + "</strong>", note: "原数组没变" };
                }
            },

            // ---------- 遍历 ----------
            {
                name: "forEach()", cat: "traverse", title: "遍历执行",
                desc: "对每个元素执行一次回调，**没有返回值**（undefined）。单纯遍历用它。",
                code: 'fruits.forEach((f, i) => {\n    console.log(i, f);\n});',
                run: function() {
                    let mm_log = [];
                    mm_fruits.forEach((f, i) => mm_log.push(i + ": " + f));
                    return { h: "forEach 遍历结果：", note: mm_log.join("\n") };
                }
            },
            {
                name: "reduce()", cat: "traverse", title: "累计归约",
                desc: "从左到右累积计算，最终得到一个值。initialVal 是初始值。",
                code: 'let str = fruits.reduce((a, b) => a + b, "");\n// str = 所有元素拼成的字符串',
                run: function() {
                    let r = mm_fruits.reduce((a, b) => a + b, "");
                    return { h: "reduce 拼接：<strong>" + r + "</strong>", note: "把所有水果拼成一串" };
                }
            },

            // ---------- 查找 / 判断 ----------
            {
                name: "indexOf()", cat: "check", title: "查找索引",
                desc: "返回元素在数组中第一次出现的位置，找不到返回 -1。",
                code: 'let i = fruits.indexOf("🍇");',
                run: function() {
                    let r = mm_fruits.indexOf("🍇");
                    return { h: "indexOf('🍇') 返回：<strong>" + r + "</strong>", note: r === -1 ? "没找到" : "index=" + r };
                }
            },
            {
                name: "includes()", cat: "check", title: "是否包含",
                desc: "判断数组是否包含某个元素，返回 true / false。比 indexOf 更直观。",
                code: 'let has = fruits.includes("🍓");',
                run: function() {
                    let r1 = mm_fruits.includes("🍓");
                    let r2 = mm_fruits.includes("🍑");
                    return { h: "includes('🍓')=<strong>" + r1 + "</strong>  includes('🍑')=<strong>" + r2 + "</strong>", note: "一个 true 一个 false" };
                }
            },
            {
                name: "find()", cat: "check", title: "查找元素",
                desc: "返回**第一个**让回调返回 true 的**元素值**，找不到返回 undefined。",
                code: 'let f = fruits.find(x => x > "🍊");',
                run: function() {
                    let r = mm_fruits.find(x => x > "🍊");
                    return { h: "find(x => x>'🍊')：<strong>" + (r||"undefined") + "</strong>", note: "按 Unicode 比较" };
                }
            },
            {
                name: "join()", cat: "check", title: "拼接字符串",
                desc: "用分隔符把所有元素拼成一个字符串返回。默认分隔符是逗号。",
                code: 'let s = fruits.join(" - ");',
                run: function() {
                    let r = mm_fruits.join(" - ");
                    return { h: "join(' - ')：<strong>" + r + "</strong>", note: "所有水果被 ' - ' 连起来了" };
                }
            }
        ];

        // ===== 渲染所有方法卡片 =====
        function mm_renderCards() {
            let mm_wrap = document.getElementById("mm_cards");
            let mm_catName = { mutate:"改变原数组", traverse:"遍历与归约", new:"返回新数组", check:"查找 / 判断" };
            mm_methods.forEach((m, idx) => {
                let mm_div = document.createElement("div");
                mm_div.className = "mm_method";
                mm_div.setAttribute("data-cat", m.cat);
                mm_div.innerHTML =
                    '<div class="mm_mtitle"><code>' + m.name + '</code><span class="mm_cat-label">' + mm_catName[m.cat] + '</span></div>' +
                    '<div class="mm_mdesc ' + (m.descTag||'') + '">' + m.desc + '</div>' +
                    '<div class="mm_code"><span class="c">// ' + m.title + '</span>\n' + m.code + '</div>' +
                    '<div class="mm_actions">' +
                        '<button class="mm_btn" onclick="mm_run(' + idx + ')">▶ 运行</button>' +
                        '<button class="mm_btn mmm_reset" onclick="mm_reset()">↺ 还原数组</button>' +
                    '</div>' +
                    '<div class="mm_result" id="mm_res_' + idx + '">点击 ▶ 运行 查看结果 →</div>';
                mm_wrap.appendChild(mm_div);
            });
        }
        mm_renderCards();

        // ===== 运行某个方法 =====
        function mm_run(idx) {
            let m = mm_methods[idx];
            let r = m.run();
            document.getElementById("mm_res_" + idx).innerHTML =
                '<div style="margin-bottom:4px;">' + r.h + '</div>' +
                '<div style="color:#6b7280;font-size:.72rem;white-space:pre-line;">💡 ' + r.note + '</div>';
        }

        // ===== 还原数组 =====
        function mm_reset() {
            mm_fruits = ["🍎", "🍌", "🍊", "🍇", "🍓"];
            mm_renderOrig();
            document.querySelectorAll(".mm_result").forEach(el => el.textContent = "已还原，点击 ▶ 运行 查看结果 →");
        }

        // ===== 全局暴露 =====
        window.mm_run = mm_run;
        window.mm_reset = mm_reset;
    </script>
</body>
</html>
