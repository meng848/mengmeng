<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：孟梦，日期：2026-10-29，功能名称：优酷 App 手机风格首页 - 参考截图复刻 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17-1 · 优酷 App 手机版</title>
    <link rel="stylesheet" href="font/font_5244875_7pxofbmupmt/iconfont.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f5f5;
            color: #1f2937;
            min-height: 100vh;
            padding-bottom: 70px; /* 底部导航高度 */
        }
        a { color: inherit; text-decoration: none; }

        /* ============ 手机容器 ============ */
        .mm_phone {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* ============ 顶部状态栏 ============ */
        .mm_statusbar {
            height: 22px; background: #fff; display: flex; justify-content: space-between;
            align-items: center; padding: 0 18px; font-size: .72rem; font-weight: bold; color: #1f2937;
        }
        .mm_statusbar .mm_icons { display: flex; gap: 5px; align-items: center; }

        /* ============ 顶部导航栏 ============ */
        .mm_topbar {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; background: #fff;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 50;
        }
        .mm_menu-btn { font-size: 1.35rem; cursor: pointer; color: #1f2937; }
        .mm_search-wrap {
            flex: 1; background: #f2f2f2; border-radius: 18px;
            display: flex; align-items: center; padding: 6px 12px; gap: 6px;
        }
        .mm_search-wrap i { color: #9ca3af; font-size: .85rem; }
        .mm_search-wrap input {
            border: none; background: transparent; outline: none; flex: 1;
            font-size: .82rem; color: #374151; font-family: inherit;
        }
        .mm_filter-btn { font-size: .85rem; color: #374151; cursor: pointer; display: flex; align-items: center; gap: 3px; }
        .mm_study-btn {
            background: linear-gradient(135deg,#FF1E32,#FF4D6D); color: #fff;
            font-size: .7rem; padding: 5px 10px; border-radius: 12px; font-weight: bold;
            white-space: nowrap;
        }

        /* ============ 频道 Tab ============ */
        .mm_channels {
            display: flex; overflow-x: auto; gap: 4px;
            padding: 8px 12px; background: #fff;
            border-bottom: 1px solid #f0f0f0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .mm_channels::-webkit-scrollbar { display: none; }
        .mm_chan {
            padding: 6px 14px; font-size: .85rem; color: #6b7280;
            white-space: nowrap; cursor: pointer; border-radius: 4px;
            transition: all .2s;
        }
        .mm_chan.mmm_active {
            color: #FF1E32; font-weight: bold; font-size: .92rem;
            position: relative;
        }
        .mm_chan.mmm_active::after {
            content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 18px; height: 3px; background: #FF1E32; border-radius: 2px;
        }
        .mm_chan.mmm_more { color: #9ca3af; padding-left: 4px; }

        /* ============ 会员横幅 ============ */
        .mm_vip-banner {
            margin: 12px;
            background: linear-gradient(135deg,#f5d78e 0%,#e8b94a 50%,#d4a017 100%);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 14px rgba(212,160,23,.25);
            position: relative; overflow: hidden;
        }
        .mm_vip-banner::before {
            content: "👑"; position: absolute; right: -8px; top: -10px; font-size: 3rem; opacity: .2;
        }
        .mm_vip-text { line-height: 1.5; }
        .mm_vip-title { font-size: .92rem; font-weight: bold; color: #78350f; }
        .mm_vip-sub { font-size: .75rem; color: #92400e; margin-top: 2px; }
        .mm_vip-btn {
            background: #78350f; color: #fef3c7; border: none;
            padding: 7px 14px; border-radius: 16px; font-size: .75rem; font-weight: bold;
            cursor: pointer; font-family: inherit; white-space: nowrap;
        }

        /* ============ 推荐区标题 ============ */
        .mm_section-title {
            padding: 16px 14px 8px; font-size: .95rem; font-weight: bold; color: #1f2937;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mm_section-title .mm_more { font-size: .78rem; color: #9ca3af; font-weight: normal; cursor: pointer; }

        /* ============ 视频卡片网格 ============ */
        .mm_grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 12px 16px;
        }
        .mm_card {
            background: #fff; border-radius: 10px; overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            cursor: pointer; transition: transform .15s;
        }
        .mm_card:active { transform: scale(.97); }

        .mm_thumb {
            width: 100%; aspect-ratio: 3/4; position: relative;
            display: flex; align-items: flex-end;
        }
        .mm_thumb-art {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; text-shadow: 0 4px 12px rgba(0,0,0,.3);
        }

        /* 角标 */
        .mm_badge {
            position: absolute; top: 6px; left: 6px;
            padding: 2px 8px; border-radius: 3px; font-size: .62rem;
            font-weight: bold; color: #fff;
        }
        .mm_badge.mmm-update   { background: #10b981; }  /* 有更新 绿 */
        .mm_badge.mmm-exclusive{ background: #FF1E32; }    /* 独播 红 */
        .mm_badge.mmm-follow   { background: #f59e0b; }    /* 正在追 橙 */
        .mm_badge.mmm-60fps    { background: #6366f1; }    /* 尊享60帧 蓝紫 */
        .mm_badge.mmm-top      { background: linear-gradient(90deg,#ef4444,#f59e0b); } /* 热搜/加追榜 */
        .mm_badge.mmm-theater  { background: #8b5cf6; }    /* 生花剧场 紫 */

        .mm_badge-right {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0,0,0,.55); color: #fff;
            padding: 2px 6px; border-radius: 3px; font-size: .6rem;
        }

        /* 底部更新集数 */
        .mm_ep-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,.7));
            color: #fff; font-size: .65rem; padding: 14px 8px 6px;
        }

        /* 卡片文字 */
        .mm_card-body { padding: 8px 10px 10px; }
        .mm_card-title {
            font-size: .85rem; font-weight: bold; color: #1f2937;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .mm_card-desc {
            font-size: .72rem; color: #9ca3af; margin-top: 3px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ============ 底部 Tab 导航 ============ */
        .mm_tabbar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: #fff; border-top: 1px solid #f0f0f0;
            display: flex; height: 60px; z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .mm_tab {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px;
            cursor: pointer; color: #9ca3af; transition: color .2s;
        }
        .mm_tab i { font-size: 1.3rem; font-style: normal; }
        .mm_tab span { font-size: .68rem; }
        .mm_tab.mmm_active { color: #FF1E32; }
        .mm_tab.mmm_vip i {
            background: linear-gradient(135deg,#f5d78e,#d4a017);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .mm_tab.mmm_vip.mmm_active { color: #d4a017; }

        @media (max-width: 360px) {
            .mm_thumb-art { font-size: 2.5rem; }
            .mm_card-title { font-size: .78rem; }
            .mm_vip-btn { font-size: .68rem; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div class="mm_phone">

        <!-- ============ 状态栏 ============ -->
        <div class="mm_statusbar">
            <span>16:15</span>
            <div class="mm_icons">
                <span>📶</span><span>🔋</span><span>43%</span>
            </div>
        </div>

        <!-- ============ 顶部导航 ============ -->
        <header class="mm_topbar">
            <i class="iconfont mm_menu-btn" style="font-size:1.4rem;">☰</i>
            <div class="mm_search-wrap">
                <i class="iconfont">🔍</i>
                <input type="text" placeholder="鞠婧祎 月鳞绮纪" id="mm_searchInput" value="鞠婧祎 月鳞绮纪">
            </div>
            <div class="mm_filter-btn">筛选 <i class="iconfont">▼</i></div>
            <div class="mm_study-btn">学习时刻</div>
        </header>

        <!-- ============ 频道 Tab ============ -->
        <nav class="mm_channels" id="mm_channels">
            <div class="mm_chan mmm_active" onclick="mm_chanClick(this)">首页</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">嫁金钗</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">敦煌</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">剧集</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">动漫</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">电影</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">综艺</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">纪录片</div>
            <div class="mm_chan" onclick="mm_chanClick(this)">少儿</div>
            <div class="mm_chan mmm_more">⋯</div>
        </nav>

        <!-- ============ 会员横幅 ============ -->
        <div class="mm_vip-banner" onclick="alert('👑 开通优酷 VIP')">
            <div class="mm_vip-text">
                <div class="mm_vip-title">会员续费特惠</div>
                <div class="mm_vip-sub">首3月每月15元</div>
            </div>
            <button class="mm_vip-btn">立即续费</button>
        </div>

        <!-- ============ 专属推荐 ============ -->
        <div class="mm_section-title">
            <span>🎬 今日给您的专属推荐</span>
            <span class="mm_more">换一换 ↻</span>
        </div>

        <div class="mm_grid" id="mm_grid">
            <!-- 由 JS 动态生成 -->
        </div>

    </div>

    <!-- ============ 底部导航 ============ -->
    <nav class="mm_tabbar">
        <div class="mm_tab mmm_active" onclick="mm_tabClick(this)">
            <i class="iconfont">🏠</i><span>首页</span>
        </div>
        <div class="mm_tab" onclick="mm_tabClick(this)">
            <i class="iconfont">🎬</i><span>短剧</span>
        </div>
        <div class="mm_tab mm_vip" onclick="mm_tabClick(this)">
            <i class="iconfont">👑</i><span>会员</span>
        </div>
        <div class="mm_tab" onclick="mm_tabClick(this)">
            <i class="iconfont">🛒</i><span>淘好片</span>
        </div>
        <div class="mm_tab" onclick="mm_tabClick(this)">
            <i class="iconfont">👤</i><span>我的</span>
        </div>
    </nav>

    <script>
        // ===== 视频卡片数据 =====
        const mm_videos = [
            { title:"嫁金钗",      desc:"逆天改命通杀爽局",  ep:"2集待看",   bg:"linear-gradient(135deg,#dc2626,#fbbf24)",   emoji:"👑", badges:[{t:"有更新",c:"mmm-update"},{t:"独播",c:"mmm-exclusive"},{t:"正在追",c:"mmm-follow"}] },
            { title:"一瓯春",      desc:"双强联手爽复仇",    ep:"6集待看",   bg:"linear-gradient(135deg,#059669,#10b981)",   emoji:"🌸", badges:[{t:"正在追",c:"mmm-follow"},{t:"尊享60帧",c:"mmm-60fps"}] },
            { title:"东大高学院",  desc:"带货达人业绩拉满",  ep:"更新至16话",bg:"linear-gradient(135deg,#7c3aed,#ec4899)",   emoji:"🎓", badges:[{t:"热搜榜 TOP3",c:"mmm-top"}] },
            { title:"沧元图",      desc:"归海一刀悲壮谢幕",  ep:"更新至100话",bg:"linear-gradient(135deg,#1e3a8a,#dc2626)",  emoji:"⚔️", badges:[{t:"独播",c:"mmm-exclusive"},{t:"加追榜 TOP1",c:"mmm-top"}] },
            { title:"光阴之外",    desc:"陈二牛千里陪君子",  ep:"更新至45话", bg:"linear-gradient(135deg,#0e7490,#06b6d4)",   emoji:"⏳", badges:[{t:"独播",c:"mmm-exclusive"}] },
            { title:"师兄啊师兄", desc:"女娲反抗修被囚",    ep:"更新至165话",bg:"linear-gradient(135deg,#b45309,#f59e0b)",   emoji:"🧘", badges:[{t:"独播",c:"mmm-exclusive"}] },
            { title:"生花剧场",    desc:"每周精彩剧集上新",  ep:"热播中",    bg:"linear-gradient(135deg,#be185d,#f472b6)",   emoji:"🌹", badges:[{t:"生花剧场",c:"mmm-theater"},{t:"独播",c:"mmm-exclusive"}] },
            { title:"月光变奏曲",  desc:"甜宠爱情清新治愈",  ep:"更新至24集", bg:"linear-gradient(135deg,#4338ca,#8b5cf6)",   emoji:"🌙", badges:[{t:"有更新",c:"mmm-update"}] }
        ];

        // ===== 渲染卡片 =====
        function mm_render() {
            let mm_g = document.getElementById("mm_grid");
            mm_g.innerHTML = "";
            mm_videos.forEach(v => {
                let mm_badges = v.badges.map(b => `<div class="mm_badge ${b.c}">${b.t}</div>`).join("");
                let mm_div = document.createElement("div");
                mm_div.className = "mm_card";
                mm_div.innerHTML =
                    `<div class="mm_thumb" style="background:${v.bg}">
                        <div class="mm_thumb-art">${v.emoji}</div>
                        ${mm_badges}
                        <div class="mm_ep-info">${v.ep}</div>
                    </div>
                    <div class="mm_card-body">
                        <div class="mm_card-title">${v.title}</div>
                        <div class="mm_card-desc">${v.desc}</div>
                    </div>`;
                mm_div.addEventListener("click", () => alert('▶ 即将播放：' + v.title + '\n（纯演示，实际需视频源）'));
                mm_g.appendChild(mm_div);
            });
        }
        mm_render();

        // ===== 频道 Tab 切换 =====
        function mm_chanClick(el) {
            document.querySelectorAll(".mm_chan").forEach(c => c.classList.remove("mmm_active"));
            el.classList.add("mmm_active");
        }

        // ===== 底部 Tab 切换 =====
        function mm_tabClick(el) {
            document.querySelectorAll(".mm_tab").forEach(t => t.classList.remove("mmm_active"));
            el.classList.add("mmm_active");
            let mm_name = el.querySelector("span").textContent;
            console.log("切换到：" + mm_name);
        }

        // ===== 搜索回车 =====
        document.getElementById("mm_searchInput").addEventListener("keydown", e => {
            if (e.key === "Enter") {
                alert('🔍 搜索：' + e.target.value);
            }
        });

        window.mm_chanClick = mm_chanClick;
        window.mm_tabClick = mm_tabClick;
    </script>
</body>
</html>
