<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：孟梦，日期：2026-10-29，功能名称：点击排行热榜 - 仿图还原 + Tab 切换跳转 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-4 · 点击排行</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 30px 20px 60px;
            color: #333;
        }
        .mm_container { max-width: 640px; margin: 0 auto; }
        .mm_back { color: #333; text-decoration: none; font-size: .9rem; display: inline-block; margin-bottom: 14px; }
        .mm_back:hover { color: #ff5a00; }

        /* ============ 排行卡片 ============ */
        .mm_rank-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            overflow: hidden;
        }

        /* 标题栏 */
        .mm_rank-head {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .mm_rank-head img { width: 28px; height: 28px; }
        .mm_rank-head h1 {
            font-size: 1.15rem; font-weight: bold; color: #1a1a1a;
        }

        /* Tab 切换 */
        .mm_rank-tabs {
            display: flex; border-bottom: 1px solid #f0f0f0;
        }
        .mm_rank-tabs a {
            flex: 1; text-align: center; padding: 12px 0;
            font-size: .92rem; color: #888; text-decoration: none;
            position: relative; cursor: pointer; transition: color .2s;
        }
        .mm_rank-tabs a:hover { color: #333; }
        .mm_rank-tabs a.mmm_active {
            color: #ff5a00; font-weight: bold;
        }
        .mm_rank-tabs a.mmm_active::after {
            content: ""; position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 48px; height: 3px; background: #ff5a00;
            border-radius: 2px;
        }

        /* 列表 */
        .mm_rank-list { list-style: none; }
        .mm_rank-item {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 20px; border-bottom: 1px solid #f5f5f5;
            cursor: pointer; transition: background .15s;
        }
        .mm_rank-item:last-child { border-bottom: none; }
        .mm_rank-item:hover { background: #fff7f2; }

        /* 序号徽章 */
        .mm_rank-no {
            width: 22px; height: 22px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: .78rem; font-weight: bold; font-family: Consolas, monospace;
            color: #fff; background: #bbb; border-radius: 4px;
        }
        .mm_rank-item:nth-child(1) .mm_rank-no { background: #ff3b30; }
        .mm_rank-item:nth-child(2) .mm_rank-no { background: #ff6b35; }
        .mm_rank-item:nth-child(3) .mm_rank-no { background: #ffa94d; }

        /* 标题 */
        .mm_rank-title {
            flex: 1; min-width: 0;
            font-size: .9rem; color: #333;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mm_rank-item:hover .mm_rank-title { color: #ff5a00; }

        /* 点击量 */
        .mm_rank-count {
            font-size: .78rem; color: #aaa; flex-shrink: 0;
            font-family: Consolas, monospace;
        }
        .mm_rank-count::before { content: ""; }

        @media (max-width: 500px) {
            .mm_rank-item { padding: 11px 14px; gap: 10px; }
            .mm_rank-title { font-size: .84rem; }
            .mm_rank-no { width: 20px; height: 20px; font-size: .72rem; }
        }
    </style>
</head>
<body>
    <div class="mm_container">
        <a href="index.html" class="mm_back">← 返回首页</a>

        <!-- ============ 点击排行 ============ -->
        <div class="mm_rank-card">

            <!-- 标题 -->
            <div class="mm_rank-head">
                <img src="img/rank_tit06.jpg" alt="">
                <h1>点击排行</h1>
            </div>

            <!-- Tab 切换 -->
            <nav class="mm_rank-tabs">
                <a class="mmm_active" data-tab="realtime" onclick="mm_switchTab(this)">实时点击</a>
                <a data-tab="day" onclick="mm_switchTab(this)">24小时排行</a>
            </nav>

            <!-- 列表 -->
            <ul class="mm_rank-list" id="mm_list">
                <!-- 由 JS 动态渲染 -->
            </ul>
        </div>
    </div>

    <script>
        // ===== 两套数据 =====
        const mm_data = {
            realtime: [
                "灯塔水母：地球上唯一不死生物",
                "阿里巴巴全资收购UC 俞永福称U",
                "亚马逊惊现三米长巨舌鱼 遭遇肺",
                "奉化男子上山抓野味 遭遇极端",
                "大白鲨深海失踪 或被大型生物",
                "南非小犀牛目睹母亲被杀请求",
                "余额宝周岁：收益率"过山车"",
                "\"尸油入餐桌\"纯属无稽之谈"
            ],
            day: [
                "庆余年第二季火热开播",
                "高铁动车全面提速",
                "新能源汽车销量再创新高",
                "国家博物馆推出数字展览",
                "国产大飞机完成商业首飞",
                "冬奥冠军分享训练日常",
                "最强AI模型发布 性能翻倍",
                "故宫文创新品上线即售罄"
            ]
        };

        // ===== 渲染列表 =====
        let mm_currentTab = "realtime";
        function mm_render() {
            let mm_ul = document.getElementById("mm_list");
            let mm_list = mm_data[mm_currentTab];
            let mm_countBase = mm_currentTab === "realtime" ? 356000 : 890000;

            mm_ul.innerHTML = "";
            mm_list.forEach((title, i) => {
                let mm_count = (mm_countBase - i * 31000).toString();
                // 补成原效果那种数字（原实时的点击量）
                let mm_finalCount = mm_currentTab === "realtime"
                    ? [356322, 311246, 295883, 266061, 243936, 224346, 172694, 128789][i]
                    : [892451, 745832, 698234, 612987, 554321, 487654, 398765, 287654][i];

                let mm_li = document.createElement("li");
                mm_li.className = "mm_rank-item";
                mm_li.innerHTML =
                    '<div class="mm_rank-no">' + (i + 1) + '</div>' +
                    '<div class="mm_rank-title" onclick="mm_clickItem(' + i + ')">' + title + '</div>' +
                    '<div class="mm_rank-count">' + mm_finalCount + '</div>';
                mm_ul.appendChild(mm_li);
            });
        }
        mm_render();

        // ===== Tab 切换 =====
        function mm_switchTab(el) {
            document.querySelectorAll(".mm_rank-tabs a").forEach(a => a.classList.remove("mmm_active"));
            el.classList.add("mmm_active");
            mm_currentTab = el.getAttribute("data-tab");
            mm_render();
        }

        // ===== 点击新闻项（跳转） =====
        function mm_clickItem(idx) {
            let mm_title = mm_data[mm_currentTab][idx];
            alert('即将跳转查看：\n' + mm_title);
            // 真实项目里这里会 window.location.href = "detail.html?id=" + idx;
        }

        // 暴露给全局
        window.mm_switchTab = mm_switchTab;
        window.mm_clickItem = mm_clickItem;
    </script>
</body>
</html>
