<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 50px 80px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #fff;
        }

        .student-id {
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.85;
            margin-bottom: 12px;
        }

        .student-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="student-id">24002430222</div>
        <div class="student-name">孟 梦</div>
    </div>
</body>
</html>
