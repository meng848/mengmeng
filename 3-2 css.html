<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0222 孟梦</title>
</head>
<body>
    <style>
    h3{
        color:red;
    }
    p{
        color:blue;
    }
    /*标签选择器：选择器名称为标签*/
    #box{
        width:500px;
        height:500px;
        background-color:#ccc;  
    }
    /*id选择器：以#开始，唯一*/
    .n1{
        color:#7A9;
    }
    h2{
        background-color:#000;
        color:#fff;
    }
    .n2{
        color:#f00;
    }
    .n3{
        color:#00f;
    }
    .selector{
        color:#fff;
    }
    .box2{
        width:200px;
        height:100px;
        background-color:#ff0;
    }
    </style>
    <head>
        <body>
           <h2>层叠样式表css</h2>
           <div id="box">
              <h3>CSS<span class="selector">选择器</span></h3>
              <p><span class="n2">孟</span><span class="n3">梦</span></p>
              <p>CSS属性</p>
    </div>

    <div class="box2">0222</div>

    <!-- 扩展:
        1、h2黑底白字
        2、你的名字每个字不同颜色，在同一行。
        3、选择器三个字是白色。
        4、新加一个盒子，盒子里的文字是你的学号，盒子有宽高背景。
     -->

</body>
</html>
